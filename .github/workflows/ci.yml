name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (TypeScript + Biome)
        run: bun run lint

      - name: Unit tests
        run: bun run test

      - name: Production build
        run: bun run build

      - name: Bundle size budget
        run: bun run check:bundle

  e2e:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install chromium --with-deps

      - name: End-to-end smoke tests
        run: bun run test:e2e
        env:
          CI: true
          # Placeholder values, not real secrets. Without them the app renders
          # "Configure VITE_SUPABASE_URL..." on /login and the sign-in heading
          # test fails. Nothing here contacts a real backend: the credentialed
          # tests in critical-paths.spec.ts skip when E2E_* vars are unset.
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
